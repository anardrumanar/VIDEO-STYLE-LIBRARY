<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Видео контентын стилийн сан</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Kalam:wght@400;700&family=Patrick+Hand&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#1b1d21;--blue:#2b4c86}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;background:#e4e3de;color:var(--ink);font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:18px;line-height:1.5;
 background-image:radial-gradient(rgba(27,29,33,.07) 1.2px,transparent 1.4px);background-size:20px 20px}
.marker{font-family:'Kalam','Comic Sans MS',cursive}
.mono{font-family:'Courier Prime',ui-monospace,Menlo,monospace}
.paper{background-color:#fcfcfa;background-image:linear-gradient(rgba(43,76,134,.085) 1px,transparent 1px),linear-gradient(90deg,rgba(43,76,134,.085) 1px,transparent 1px);background-size:24px 24px;box-shadow:0 2px 0 #cfcdc6,0 18px 40px rgba(27,29,33,.16)}
.card{border:2px solid var(--ink);border-radius:6px 8px 6px 10px;box-shadow:3px 5px 0 var(--ink);background:#fcfcfa;transition:transform .25s cubic-bezier(.22,.8,.24,1),box-shadow .25s cubic-bezier(.22,.8,.24,1)}
li[data-n]:hover .card{transform:translate(-3px,-5px) rotate(-.7deg);box-shadow:7px 11px 0 var(--ink)}
li[data-n]:nth-child(even):hover .card{transform:translate(-3px,-5px) rotate(.7deg)}
.frame>div{transition:transform .35s cubic-bezier(.22,.8,.24,1)}
li[data-n]:hover .frame>div{transform:scale(1.04)}
@media (prefers-reduced-motion:reduce){.card,.frame>div{transition:none}li[data-n]:hover .card,li[data-n]:hover .frame>div{transform:none}}
.frame{border:1.5px solid var(--ink);border-radius:3px;overflow:hidden}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@keyframes zoomIn{from{opacity:0;transform:scale(.82) translateY(24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scrim{animation:fade .25s ease both}
.sheet{animation:zoomIn .38s cubic-bezier(.22,.8,.24,1) both}
body.locked{overflow:hidden}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const STYLES = [
 {n:1,name:"Цаасан хайчилбар",tag:"гар урлалын редакцийн хэв маяг",engine:"Canvas 2D · цаасны бүтэц",
  desc:"Давхарласан цаас гулсаж, нугалагдан эцэст нь мэдээллийн график болон тогтоно.",
  keys:"давхарласан цаас, урагдсан ирмэг, цаасны өнгө үзэмж, зөөлөн сүүдэр"},
 {n:2,name:"Генератив бөөмс",tag:"кино маягийн технологи",engine:"Three.js цэгэн үүл · шейдер",
  desc:"Мянга мянган гэрэлтэх цэгүүд нийлж объект, үг, диаграмм үүсгэнэ.",
  keys:"гэрэлтэх цэгүүд, цэгэн үүлний хувирал, харанхуй орон зай"},
 {n:3,name:"Шингэн шил",tag:"премиум бүтээгдэхүүн",engine:"WebGL хугарлын шейдер",
  desc:"Шилэн линзүүд дүр зургийн дээгүүр гулсаж, ард нь байгаа бүхнийг нугалан харуулна.",
  keys:"премиум бүтээгдэхүүн, шилэн линз, гэрлийн хугарал, зөөлөн гэрлийн туяа"},
 {n:4,name:"Кинетик типографи",tag:"үсэг нь өөрөө дүрслэл",engine:"Canvas 2D текстийн хөдөлгүүр",
  desc:"Асар том үгс, далдлалттай илрэлт, тайлбар болон хувирдаг үсэг.",
  keys:"тод үсэг, хэмнэлд зохицсон үгс, далдлалттай илрэлт, томролтын цохилт"},
 {n:5,name:"Изометр шугаман зураг",tag:"техник зураг",engine:"Three.js ортографик · шугаман геометр",
  desc:"Өөрсдийгөө зурдаг нарийн шугаман зураг, дараа нь ажиллаж эхэлнэ.",
  keys:"изометр, нимгэн шугам, өөрөө зурагдах зураас, схем, тиль өнгийн цэгүүд"},
 {n:6,name:"Хавтгай вектор",tag:"цэвэр 2D студи",engine:"SVG зам · дүрсийн хувирал",
  desc:"Нэг санаанаас нөгөөд хувирдаг тод 2D дүрслэл.",
  keys:"хавтгай дүрсүүд, хувирах замууд, пастел палитр, энгийн дүрс тэмдэг"},
 {n:7,name:"Хальсны дурсамж",tag:"ёрөөлтэй дурсамж",engine:"Canvas 2D · хальсны үр, гэрлийн алдагдал",
  desc:"16мм хальсны үр, гэрлийн алдагдал, бүдэгхэн дулаан өнгө бүхий гэрийн видеоны мэдрэмж.",
  keys:"16мм үр, гэрлийн алдагдал, гарын чичиргээ, бүдэгхэн дулаан өнгө"},
 {n:8,name:"Өгөгдлийн лугшилт",tag:"график ба статистик",engine:"SVG + Canvas · хөдөлгөөнт график",
  desc:"График өсч, тоолуур хэмнэлээр тоолж, тоо баримт амилна.",
  keys:"хөдөлгөөнт график, өсөх тоонууд, минимал палитр, инфографик"},

const buildPrompt = (s,v={}) => `# ДААЛГАВАР
${s.name} (${s.tag}) хэв маягтай хөдөлгөөнт видео бүтээ.
Ашиглах технологи: ${s.engine}.

Дүр төрх ба хөдөлгөөн: ${s.desc}
Түлхүүр үгс: ${s.keys}

# ТӨСЛИЙН ТОХИРГОО
**Сэдэв:** ${v.topic||"{{СЭДЭВ}}"}
- Storyboard: ${v.storyboard===undefined?"{{STORYBOARD}}":(v.storyboard?"тийм, эхлээд кадруудыг батлуулахаар үзүүл":"үгүй")}
- Дуу хоолой: ${v.voiceover===undefined?"{{ДУУ_ХООЛОЙ}}":(v.voiceover?"тийм, би MP3 хавсаргана":"үгүй")}
- Харьцаа: ${v.format||"{{ХАРЬЦАА}}"}
- Хугацаа: ${v.duration||"{{ХУГАЦАА}}"}
- Дуу эффект: {{ЭФФЕКТ}}

Тоглуулах удирдлагатай, MP4 экспортлодог HTML Artifact болгон бүтээ.`;

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{ const a=document.createElement("textarea"); a.value=t; a.style.cssText="position:fixed;opacity:0";
      document.body.appendChild(a); a.select(); const ok=document.execCommand("copy"); a.remove(); return ok; }
    catch(e2){ return false; }
  }
}

const dots = "radial-gradient(#5eead4 1.2px,transparent 1.6px),radial-gradient(#60a5fa 1px,transparent 1.4px)";
function Preview({n}){
  const base="aspect-[16/9] w-full relative";
  if(n===1) return (<div className={base} style={{background:"#e9e2cf"}}>
    <span className="mono absolute left-2 top-2 rounded-sm bg-orange-400 px-1.5 text-[9px] font-bold text-white">AI АГЕНТ</span>
    <div className="absolute left-1/2 top-1/2 h-[62%] w-[34%] -translate-x-1/2 -translate-y-[44%] rounded-full border-[7px] border-teal-700/80"/>
    <div className="absolute left-[40%] top-[40%] h-[18%] w-[20%] rounded-md bg-slate-700"/>
    <div className="absolute left-[8%] top-[42%] h-[30%] w-[16%] rounded-sm bg-lime-300"/>
    <div className="absolute right-[8%] top-[28%] h-[16%] w-[22%] rounded-sm bg-orange-300"/>
    <div className="absolute right-[10%] bottom-[14%] h-[18%] w-[20%] rounded-sm bg-sky-300"/>
    <div className="absolute inset-x-0 bottom-0 h-[10%] bg-stone-400/60"/></div>);
  if(n===2) return (<div className={base} style={{background:"#0b1226",backgroundImage:dots,backgroundSize:"14px 14px,23px 23px"}}>
    <span className="mono absolute left-[8%] top-[18%] text-lg font-bold tracking-widest text-teal-300/70">ХУУЧИН</span>
    <span className="mono absolute right-[8%] top-[18%] text-lg font-bold tracking-widest text-violet-300/70">ШИНЭ</span>
    <div className="absolute left-[8%] top-[42%] h-[30%] w-[34%] rounded border border-teal-400/40 bg-teal-300/5"/>
    <div className="absolute right-[8%] top-[42%] h-[30%] w-[34%] rounded border border-violet-400/40 bg-violet-300/5"/>
    <div className="absolute left-1/2 top-[58%] h-6 w-6 -translate-x-1/2 rounded-full border border-white/50"/></div>);
  if(n===3) return (<div className={base} style={{background:"radial-gradient(circle at 30% 20%,#1e3a8a,#0a0f24 70%)"}}>
    <span className="absolute left-3 top-2 text-sm font-bold text-white">Санаа <span className="font-normal text-white/50">· апп</span></span>
    <div className="absolute left-[18%] top-[24%] h-[42%] w-[64%] rounded-xl border border-white/30 bg-white/10 shadow-[0_8px_30px_rgba(0,0,0,.4)] backdrop-blur-md"/>
    <div className="absolute right-[24%] top-[36%] h-8 w-8 rounded-full border border-white/50 bg-white/20"/>
    <div className="absolute inset-x-[8%] bottom-[10%] flex gap-2">{[0,1,2,3].map(i=><div key={i} className="h-5 flex-1 rounded border border-blue-300/40 bg-blue-300/10"/>)}</div></div>);
  if(n===4) return (<div className={base+" flex"}>
    <div className="relative w-[45%] bg-[#0f1118]"><span className="marker absolute left-2 top-[28%] text-xl font-bold text-white">БҮДЭГ</span>
      <div className="absolute inset-x-1 top-[44%] h-1.5 bg-red-500"/></div>
    <div className="relative flex-1 bg-[#f6f2e8] p-2"><span className="marker text-xl font-bold text-blue-600">ТОДОРХОЙ</span>
      {["ЗОРИЛГО","ДЭЛГЭРЭНГҮЙ","ХЯЗГААР","ЖИШЭЭ","ҮНЭЛГЭЭ"].map((t,i)=>
        <div key={t} className={"mono text-[8px] font-bold "+(i===2?"bg-lime-300":"")}>{t}</div>)}</div></div>);
  if(n===5) return (<div className={base} style={{background:"#0b1220"}}>
    <svg viewBox="0 0 160 90" className="absolute inset-0 h-full w-full" fill="none" stroke="#5eead4" strokeWidth=".7">
      <path d="M80 18l34 19v26L80 82 46 63V37z"/><path d="M80 18v26l34-7M80 44L46 37M80 44v38"/>
      <path d="M20 70l22-12M118 30l30-14" stroke="#f59e0b"/><circle cx="80" cy="44" r="2.5" fill="#5eead4"/><circle cx="148" cy="16" r="2" fill="#f59e0b"/></svg>
    <span className="mono absolute bottom-1.5 left-2 text-[9px] font-bold text-white">Захиалга · хаалга</span></div>);
  if(n===6) return (<div className={base} style={{background:"#f4efe0"}}>
    <span className="marker absolute left-2 top-1 text-[11px] font-bold">Нарны гэрэл → гэрийн цахилгаан</span>
    <div className="absolute left-[10%] top-[30%] h-[34%] w-[20%] rounded-full bg-yellow-400"/>
    <div className="absolute left-[42%] top-[44%] h-[34%] w-[26%] bg-violet-200"/>
    <div className="absolute left-[38%] top-[26%] h-[22%] w-[34%] bg-blue-600" style={{clipPath:"polygon(15% 0,85% 0,100% 100%,0 100%)"}}/>
    <div className="absolute right-[6%] top-[28%] h-[40%] w-[2%] bg-stone-500"/>
    <div className="absolute inset-x-0 bottom-0 h-[12%] bg-emerald-200"/></div>);
  if(n===7) return (<div className={base} style={{background:"linear-gradient(135deg,#6b4a2b,#c9a46a 55%,#e8c98f)"}}>
    <div className="absolute inset-0 opacity-25" style={{backgroundImage:"repeating-radial-gradient(circle at 20% 30%,#000 0 1px,transparent 1px 3px)"}}/>
    <div className="absolute -right-6 top-0 h-full w-1/3 bg-orange-400/40 blur-xl"/>
    <div className="absolute left-[14%] top-[22%] h-[52%] w-[46%] border-4 border-white/70"/></div>);
  return (<div className={base} style={{background:"#eef3f1"}}>
    <div className="absolute inset-x-[8%] bottom-[14%] flex h-[56%] items-end gap-2">
      {[35,55,45,75,95].map((h,i)=><div key={i} className="flex-1 rounded-t" style={{height:h+"%",background:["#bfdbfe","#a7f3d0","#fde68a","#fbcfe8","#c4b5fd"][i]}}/>)}</div>
    <span className="mono absolute left-3 top-2 text-xl font-bold text-slate-700">87%</span></div>);
}

function Card({s,onOpen}){
  const [copied,setCopied]=useState(false);
  const onCopy=async(e)=>{ e.stopPropagation(); if(await copyText(buildPrompt(s))){ setCopied(true); setTimeout(()=>setCopied(false),2000); } };
  return (
    <li id={`s${s.n}`} data-n={s.n} className="relative min-w-0 pt-3">
      <span className="absolute left-1/2 top-0 z-10 h-4 w-4 -translate-x-1/2 rounded-full border-2 border-stone-600 bg-stone-300"/>
      <div className="card cursor-pointer p-3 sm:p-4" role="button" tabIndex={0} aria-label={`${s.name} — нээх`}
        onClick={()=>onOpen(s)} onKeyDown={e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); onOpen(s); } }}>
        <div className="frame"><Preview n={s.n}/></div>
        <div className="mt-3 flex items-start justify-between gap-2">
          <span className="marker grid h-8 w-8 shrink-0 place-items-center rounded-full border-2 border-[var(--ink)] bg-white text-base font-bold">{s.n}</span>
          <span className="mono pt-1 text-right text-[11px] text-stone-500">{s.engine}</span>
        </div>
        <h3 className="marker mt-1 text-2xl font-bold leading-tight">{s.name}</h3>
        <p className="text-[15px] text-[var(--blue)]">{s.tag}</p>
        <p className="mt-1 text-[17px] leading-snug text-stone-600">{s.desc}</p>
        <p className="mono mt-1 text-[11px] leading-snug text-stone-400">{s.keys}</p>
        <button onClick={onCopy} className={"marker mt-3 text-[16px] font-bold italic transition "+(copied?"text-emerald-700":"text-[var(--blue)] hover:underline")}>
          {copied ? "Хуулагдлаа!" : "Тохируулж, prompt хуулах →"}
        </button>
      </div>
    </li>
  );
}

function Timeline({active}){
  return (
    <nav aria-label="Стилиуд" className="sticky top-6 flex h-[calc(100vh-3rem)] max-h-[560px] justify-center">
      <div className="relative flex w-8 flex-col items-center justify-between py-1 sm:w-10"
           style={{background:"linear-gradient(#b8b5ab,#b8b5ab) center/2px 100% no-repeat"}}>
        {STYLES.map(s=>(
          <a key={s.n} href={`#s${s.n}`} title={s.name} aria-label={s.name}
             className={"marker relative z-10 grid place-items-center rounded-full border-2 text-xs font-bold transition-all "+
              (active===s.n?"h-7 w-7 border-[var(--blue)] bg-[#ecf0f7] text-[var(--blue)] sm:h-8 sm:w-8":"h-4 w-4 border-stone-400 bg-white text-transparent hover:border-[var(--blue)] sm:h-5 sm:w-5")}>
            {active===s.n?s.n:""}
          </a>))}
      </div>
    </nav>
  );
}

function Sheet({s,onClose}){
  const [v,setV]=useState({topic:"",format:"16:9",duration:"30 сек",storyboard:true,voiceover:false});
  const [copied,setCopied]=useState(false);
  useEffect(()=>{
    if(!s) return;
    setCopied(false);
    document.body.classList.add("locked");
    const k=e=>{ if(e.key==="Escape") onClose(); };
    window.addEventListener("keydown",k);
    return()=>{ document.body.classList.remove("locked"); window.removeEventListener("keydown",k); };
  },[s]);
  if(!s) return null;
  const set=(k,x)=>setV(o=>({...o,[k]:x}));
  const text=buildPrompt(s,v);
  const onCopy=async()=>{ if(await copyText(text)){ setCopied(true); setTimeout(()=>setCopied(false),2000); } };
  const lab="marker block text-sm font-bold";
  const inp="mt-1 w-full rounded border-2 border-[var(--ink)] bg-white px-2 py-1 text-base";
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center sm:items-center" role="dialog" aria-modal="true" aria-label={s.name}>
      <div className="scrim absolute inset-0 bg-stone-900/45" onClick={onClose}/>
      <div className="sheet card relative max-h-[92vh] w-full max-w-3xl overflow-y-auto p-4 sm:p-6">
        <button onClick={onClose} aria-label="Хаах" className="marker absolute right-3 top-3 grid h-8 w-8 place-items-center rounded-full border-2 border-[var(--ink)] bg-white text-lg font-bold leading-none hover:bg-stone-100">×</button>
        <div className="grid gap-5 md:grid-cols-2">
          <div>
            <div className="frame"><Preview n={s.n}/></div>
            <span className="mono mt-2 block text-[11px] text-stone-500">{s.engine}</span>
            <h2 className="marker mt-1 text-3xl font-bold leading-tight">{s.n}. {s.name}</h2>
            <p className="text-[var(--blue)]">{s.tag}</p>
            <p className="mt-1 text-lg leading-snug text-stone-600">{s.desc}</p>
            <p className="mono mt-1 text-[11px] text-stone-400">{s.keys}</p>
          </div>
          <div className="space-y-3">
            <label className={lab}>Сэдэв<input className={inp} value={v.topic} onChange={e=>set("topic",e.target.value)} placeholder="Жишээ: Нарны эрчим хүч хэрхэн ажилладаг вэ"/></label>
            <div className="grid grid-cols-2 gap-3">
              <label className={lab}>Харьцаа<select className={inp} value={v.format} onChange={e=>set("format",e.target.value)}><option>16:9</option><option>9:16</option><option>1:1</option></select></label>
              <label className={lab}>Хугацаа<select className={inp} value={v.duration} onChange={e=>set("duration",e.target.value)}><option>15 сек</option><option>30 сек</option><option>60 сек</option><option>90 сек</option></select></label>
            </div>
            <label className="flex items-center gap-2"><input type="checkbox" className="h-4 w-4" checked={v.storyboard} onChange={e=>set("storyboard",e.target.checked)}/>Storyboard (кадр төлөвлөгөө)</label>
            <label className="flex items-center gap-2"><input type="checkbox" className="h-4 w-4" checked={v.voiceover} onChange={e=>set("voiceover",e.target.checked)}/>Дуу хоолой (voiceover)</label>
            <pre className="mono max-h-40 overflow-auto whitespace-pre-wrap rounded border-2 border-dashed border-stone-400 bg-white/70 p-2 text-[11px] leading-snug">{text}</pre>
            <button onClick={onCopy} className={"marker w-full rounded border-2 border-[var(--ink)] py-2 text-lg font-bold transition "+(copied?"bg-emerald-100 text-emerald-800":"bg-[#ecf0f7] text-[var(--blue)] hover:bg-[#dfe6f2]")} style={{boxShadow:"2px 3px 0 var(--ink)"}}>
              {copied?"Хуулагдлаа!":"Prompt хуулах"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

const HOW=[["Стиль сонгох","Карт бүр тухайн стилээр зурсан кадрыг үзүүлнэ."],["Тохируулах","Сэдэв, storyboard, дуу хоолой, харьцаа."],
 ["Claude руу буулгах","Шинэ чат нээнэ. Дуу хоолой сонгосон бол MP3-аа хавсаргана."],["MP4 экспортлох","Claude-ийн бүтээсэн анимаци дээрх Export товчийг дарна."]];

function App(){
  const [active,setActive]=useState(1);
  const [open,setOpen]=useState(null);
  useEffect(()=>{
    const els=[...document.querySelectorAll("li[data-n]")];
    const io=new IntersectionObserver(es=>{
      const v=es.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];
      if(v) setActive(+v.target.dataset.n);
    },{rootMargin:"-20% 0px -60% 0px"});
    els.forEach(e=>io.observe(e)); return()=>io.disconnect();
  },[]);
  return (
    <div className="px-2 py-4 sm:px-4 sm:py-6">
      <div className="paper mx-auto max-w-5xl rounded-md px-3 pb-16 pt-8 sm:px-8">
        <header className="max-w-2xl pl-10 sm:pl-14">
          <span className="mono text-[13px] font-bold uppercase tracking-[.14em] text-[var(--blue)]">Тэмдэглэл · видео prompt-ын сан</span>
          <h1 className="marker mt-2 text-4xl font-bold leading-tight sm:text-5xl">8 видео стиль, стиль бүрт <span className="underline decoration-[rgba(43,76,134,.55)] decoration-4 underline-offset-4">нэг prompt</span></h1>
          <p className="mt-3 text-xl">Стилээ сонгоод, prompt-ыг Claude руу хуулна. Claude тоглуулж болдог анимаци бүтээж, MP4 болгон экспортлоно.</p>
        </header>
        <ol className="mt-6 grid grid-cols-2 gap-x-6 gap-y-4 pl-10 sm:pl-14 lg:grid-cols-4">
          {HOW.map(([t,d],i)=>(<li key={t} className="flex items-start gap-2 text-[15px] leading-tight text-stone-600">
            <span className="marker grid h-7 w-7 shrink-0 place-items-center rounded-full border-2 border-[var(--ink)] bg-white text-sm font-bold text-[var(--ink)]">{i+1}</span>
            <span><b className="marker block italic text-[var(--ink)]">{t}</b>{d}</span></li>))}
        </ol>
        <div className="mt-8 flex gap-3 sm:gap-6">
          <aside className="w-8 shrink-0 sm:w-10"><Timeline active={active}/></aside>
          <ul className="grid min-w-0 flex-1 list-none grid-cols-1 gap-x-8 gap-y-10 p-0 sm:grid-cols-2">
            {STYLES.map(s=><Card key={s.n} s={s} onOpen={setOpen}/>)}
          </ul>
        </div>
      </div>
      <Sheet s={open} onClose={()=>setOpen(null)}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
